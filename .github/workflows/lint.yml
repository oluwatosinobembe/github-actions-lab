name: golangci-lint-withdrawal

on: [pull_request]

jobs:
  golangci-for-withdrawal-service:
    name: withdrawal-golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Configure git for private modules
        env:
          TOKEN: ${{ secrets.DOCKER_GITHUB_TOKEN }}
        run: git config --global url."https://segsalerty2013:${TOKEN}@github.com".insteadOf "https://github.com"
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v2.6.2

          # Optional: working directory, useful for monorepo
          working-directory: ./src

          # Optional: golangci-lint command line arguments.
          args: --config=../.golangci.yml --timeout=5m
